<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5 Rewa Road 3D</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.132.0/Build/Cesium/Widgets/widgets.css">

<style>
  html,body{margin:0;height:100%;background:#111;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
  #c{position:absolute;inset:0}
  #panel{position:absolute;top:58px;left:12px;width:280px;max-height:calc(100% - 96px);overflow:auto;background:rgba(20,20,20,.88);color:#eee;border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.4;z-index:5}
  #panel h1{font-size:15px;margin:0 0 6px}
  #panel.hidden{display:none}
  #menuBtn{position:absolute;top:12px;left:12px;z-index:6;background:rgba(20,20,20,.88);color:#eee;border:1px solid #555;border-radius:8px;
           padding:8px 12px;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:8px}
  #menuBtn .bars{display:inline-block;width:16px;height:2px;background:#eee;box-shadow:0 5px 0 #eee,0 -5px 0 #eee}
  @media (max-width: 700px) {
    #panel{left:8px;right:8px;width:auto;top:54px;max-height:calc(100% - 120px);font-size:14px;padding:10px 12px}
    #panel input[type=range]{height:28px}
    #panel input[type=checkbox], #panel input[type=radio]{transform:scale(1.25);margin-right:6px}
    button{padding:8px 10px;font-size:13px}
    #menuBtn{top:8px;left:8px}
  }
  #panel label{display:block;margin-top:8px}
  #panel input[type=range]{width:100%}
  .sec{margin-top:14px;padding-top:8px;border-top:1px solid #444;color:#f2c14e;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
  .row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
  button{background:#333;color:#eee;border:1px solid #555;border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer}
  button:hover{background:#444}
  #status{margin-top:10px;color:#9ec3d6;font-size:12px}
  .v{float:right;color:#9ec3d6;font-variant-numeric:tabular-nums}
</style>
</head>

<div id="c"></div>
<button id="menuBtn" aria-expanded="true" aria-controls="panel"><span class="bars"></span><span id="menuLbl">Hide menu</span></button>
<div id="panel">
  <h1>5 Rewa Road · concept house</h1>
  <label><input type="checkbox" id="shadows"> Sun shadows</label>
  <label>Time of day <span class="v" id="tv"></span><input type="range" id="time" min="6" max="20" step="0.25" value="9"></label>

  <div class="sec">Site (ground from LINZ LiDAR)</div>

  <label><input type="checkbox" id="g3d" checked> Google 3D surroundings</label>
  <label><input type="checkbox" id="site" checked> Show grass ground model</label>

  <label>Raise / lower <span class="v" id="v_sh"></span><input type="range" id="sh" min="-6" max="4" step="0.1" value="-1.5"></label>
  <label>Rotate <span class="v" id="v_sr"></span><input type="range" id="sr" min="-25" max="15" step="0.05" value="-7.25"></label>
  <label>Shift east / west <span class="v" id="v_se"></span><input type="range" id="se" min="-6" max="6" step="0.1" value="0"></label>
  <label>Shift north / south <span class="v" id="v_sn"></span><input type="range" id="sn" min="-6" max="6" step="0.1" value="0"></label>
  <label>Cleared area – east edge <span class="v" id="v_ce"></span><input type="range" id="ce" min="-6" max="12" step="0.5" value="-2"></label>
  <label>Grass blend past the cut-out <span class="v" id="v_gx"></span><input type="range" id="gx" min="0" max="8" step="0.5" value="6.5"></label>
  <label>Cleared area – west edge <span class="v" id="v_cw"></span><input type="range" id="cw" min="6" max="45" step="0.5" value="22"></label>

  <div class="sec">House (sits on the site)</div>
  <label><input type="checkbox" id="house" checked> Show new house</label>
  <label><input type="radio" name="phase" id="ph1"> Phase 1 (basement + one level)</label>
  <label style="margin-top:2px"><input type="radio" name="phase" id="ph2" checked> Full build (phase 2)</label>
  <label style="margin-top:2px"><input type="radio" name="phase" id="ph3"> New layout: house north, garage south</label>
  <label>Ground floor level (RL) <span class="v" id="v_hh"></span><input type="range" id="hh" min="10" max="16" step="0.05" value="12"></label>
  <label>Front wall from road boundary <span class="v" id="v_hf"></span><input type="range" id="hf" min="0" max="25" step="0.25" value="3"></label>
  <label>Gap to No. 7 boundary <span class="v" id="v_hs"></span><input type="range" id="hs" min="0" max="4" step="0.05" value="1"></label>
  <label>Rotate within site <span class="v" id="v_hr"></span><input type="range" id="hr" min="-15" max="15" step="0.5" value="0"></label>

  <div class="sec" id="secView">View from upstairs (over No. 3)</div>
  <div class="row" style="margin-top:4px">
    <button id="vwGo">Stand upstairs</button>
    <button id="vwExit">Back to orbit</button>
  </div>
  <label>Position along the north wall <span class="v" id="v_vp"></span><input type="range" id="vp" min="0.5" max="11.5" step="0.25" value="6"></label>
  <label>Look direction <span class="v" id="v_vd"></span><input type="range" id="vd" min="-80" max="80" step="1" value="0"></label>
  <label>Look up / down <span class="v" id="v_vt"></span><input type="range" id="vt" min="-20" max="15" step="0.5" value="-2"></label>
  <label>Eye height above upstairs floor <span class="v" id="v_ve"></span><input type="range" id="ve" min="1.0" max="2.0" step="0.05" value="1.6"></label>
  <div id="vinfo" style="margin-top:6px;font-size:12px;color:#ddd">Use “Ground floor level (RL)” above to raise or lower the house and watch the view change.</div>

  <div class="row">
    <button id="vStreet">Street view</button>
    <button id="vAerial">Aerial</button>
    <button id="vNorth">From No. 3</button>
    <button id="vBack">From the back</button>
  </div>
  <div id="status">Loading…</div>
</div>

  box.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:min(90vw,460px);background:#2a1d1d;color:#fdd;border:1px solid #a33;border-radius:10px;padding:16px 18px;font-size:14px;line-height:1.45;z-index:9';
  const tokenHint = /401|403|Unauthorized|Forbidden|token|Invalid access/i.test(msg)
    ? '<br><br>This usually means the Cesium access token in this file is not allowed here: check the token\'s <b>Allowed URLs</b> and that it has access to <b>all assets</b> (or at least Cesium World Terrain and Google Photorealistic 3D Tiles) in Cesium ion.'
    : (location.protocol === 'file:' ? '<br><br>If this is the GitHub share copy, its token may be locked to the GitHub address, so it will not work when opened from your computer.' : '');
  box.innerHTML = '<b>The 3D view could not load.</b><br>' + msg.replace(/</g, '&lt;') + tokenHint;
  document.body.appendChild(box);
 }
})();
</script>
</body>
