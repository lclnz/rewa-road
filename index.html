<html lang="en">

<title>5 Rewa Road 3D</title>

  html,body{margin:0;height:100%;background:#111;font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}

  button:hover{background:#444}

<div id="c"></div>

  <label><input type="checkbox" id="site" checked> Show grass ground model</label>

  <label>Shift east / west <span class="v" id="v_se"></span><input type="range" id="se" min="-6" max="6" step="0.1" value="0"></label>
  <label>Shift north / south <span class="v" id="v_sn"></span><input type="range" id="sn" min="-6" max="6" step="0.1" value="0"></label>
  <label>Cleared area – east edge <span class="v" id="v_ce"></span><input type="range" id="ce" min="-6" max="12" step="0.5" value="-2"></label>
  <label>Grass blend past the cut-out <span class="v" id="v_gx"></span><input type="range" id="gx" min="0" max="8" step="0.5" value="6.5"></label>
  <label>Cleared area – west edge <span class="v" id="v_cw"></span><input type="range" id="cw" min="6" max="45" step="0.5" value="19.5"></label>

  <div class="sec">House (sits on the site)</div>
  <label><input type="checkbox" id="house" checked> Show new house</label>
  <label><input type="radio" name="phase" id="ph1"> Phase 1 (basement + one level)</label>
  <label style="margin-top:2px"><input type="radio" name="phase" id="ph2" checked> Full build (phase 2)</label>

  <label>Front wall from road boundary <span class="v" id="v_hf"></span><input type="range" id="hf" min="0" max="25" step="0.25" value="3"></label>

  <div class="sec">View from upstairs (over No. 3)</div>
  <div class="row" style="margin-top:4px">
    <button id="vwGo">Stand upstairs</button>
    <button id="vwExit">Back to orbit</button>
  </div>

  </div>
  <div id="status">Loading…</div>
</div>

    const e0 = FRONT - S.cw - X, e1 = FRONT - S.ce + X;           // grass runs X metres past the cut-out at both ends
    const xs = steps(e0, e1), ys = steps(SOUTH, NORTH);
    const lenM = e1 - e0, widM = NORTH - SOUTH;
    const pos = [], st = [];
    const add = (e, n) => { const w = siteToWorld(e, n, terrain(e, n)); pos.push(w.x, w.y, w.z);
      st.push(0.001 + 0.998 * (e - e0) / lenM, 0.001 + 0.998 * (n - SOUTH) / widM); };
    for (let i = 0; i < xs.length - 1; i++) for (let j = 0; j < ys.length - 1; j++) {
      const q = [[xs[i], ys[j]], [xs[i+1], ys[j]], [xs[i+1], ys[j+1]], [xs[i], ys[j+1]]];
      for (const k of [0, 1, 2, 0, 2, 3]) add(...q[k]);
    }
    const P = new Float64Array(pos), n = P.length / 3;
    const geometry = new Cesium.Geometry({
      attributes: {
        position: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.DOUBLE, componentsPerAttribute: 3, values: P }),
        st: new Cesium.GeometryAttribute({ componentDatatype: Cesium.ComponentDatatype.FLOAT, componentsPerAttribute: 2, values: new Float32Array(st) })
      },
      indices: new Uint32Array([...Array(n).keys()]),
      primitiveType: Cesium.PrimitiveType.TRIANGLES,
      boundingSphere: Cesium.BoundingSphere.fromVertices(P)
    });
    Cesium.GeometryPipeline.computeNormal(geometry);
    const cv = grassCanvas(lenM, widM, X, X, FRONT - e0, FRONT - e1);
    const prim = new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({ geometry }),
      appearance: new Cesium.MaterialAppearance({
        material: Cesium.Material.fromType('Image', { image: cv.toDataURL('image/png'), repeat: new Cesium.Cartesian2(1, 1) }),
        materialSupport: Cesium.MaterialAppearance.MaterialSupport.TEXTURED,
        translucent: true, closed: false, faceForward: true
      }),
      asynchronous: false, shadows: Cesium.ShadowMode.RECEIVE_ONLY, show
    });
    scene.primitives.add(prim); sitePrims.push(prim);
  }

  // ---------- height-to-boundary (recession) planes: 2.5 m up at each side boundary, then 45° inward ----------
  let hirbPrims = [];
  function makeLines(pos, rgba, show) {
    const n = pos.length / 3;
    const geometry = new Cesium.Geometry({
      attributes: { position: new Cesium.GeometryAttribute({
        componentDatatype: Cesium.ComponentDatatype.DOUBLE, componentsPerAttribute: 3, values: pos }) },
      indices: new Uint32Array([...Array(n).keys()]),
      primitiveType: Cesium.PrimitiveType.LINES,
      boundingSphere: Cesium.BoundingSphere.fromVertices(pos)
    });
    const prim = new Cesium.Primitive({
      geometryInstances: new Cesium.GeometryInstance({ geometry,
        attributes: { color: Cesium.ColorGeometryInstanceAttribute.fromColor(new Cesium.Color(...rgba)) } }),
      appearance: new Cesium.PerInstanceColorAppearance({ flat: true, translucent: rgba[3] < 1 }),
      asynchronous: false, show
    });
    scene.primitives.add(prim);
    return prim;
  }
  function buildHirb() {
    hirbPrims.forEach(p => scene.primitives.remove(p)); hirbPrims = [];
    const show = $('hirb').checked;
    const eFront = FRONT, eBack = FRONT - 30, IN = 9;              // 30 m back from the road, 9 m in from each boundary
    for (const [nb, dir, col] of [[SOUTH, 1, [0.88, 0.25, 0.22]], [NORTH, -1, [0.95, 0.6, 0.15]]]) {
      const P = (e, k) => siteToWorld(e, nb + dir * k, groundRL(e, nb) - RL0 + 2.5 + k);
      const tri = [], ln = [];
      const es = steps(eBack, eFront, 1.0), ks = steps(0, IN, 0.5);
      for (let i = 0; i < es.length - 1; i++) for (let j = 0; j < ks.length - 1; j++) {
        const a = P(es[i], ks[j]), b = P(es[i+1], ks[j]), c = P(es[i+1], ks[j+1]), d = P(es[i], ks[j+1]);
        tri.push(a, b, c, a, c, d);
      }
      for (const e of es) for (let j = 0; j < ks.length - 1; j += 1) ln.push(P(e, ks[j]), P(e, ks[j+1]));
      for (let k = 0; k <= IN; k += 1) for (let i = 0; i < es.length - 1; i++) ln.push(P(es[i], k), P(es[i+1], k));
      // vertical 2.5 m posts along the boundary
      for (const e of es) ln.push(siteToWorld(e, nb, groundRL(e, nb) - RL0), P(e, 0));
      hirbPrims.push(makePrim(flat(tri), [...col, 0.22], Cesium.ShadowMode.DISABLED, show));
      hirbPrims.push(makeLines(flat(ln), [...col, 0.9], show));
    }
  }

  // ---------- neighbours' houses: NZ Building Outlines footprints + LiDAR roof surfaces ----------
  let neighPrims = [];
  function buildNeigh() {
    neighPrims.forEach(p => scene.primitives.remove(p)); neighPrims = [];
    for (const grp of NEIGH) {
      const pts = [];
      for (let i = 0; i < grp.p.length; i += 3) pts.push(siteToWorld(grp.p[i], grp.p[i+1], grp.p[i+2]));
      neighPrims.push(makePrim(flat(pts), grp.c, Cesium.ShadowMode.ENABLED, $('neigh').checked));
    }
  }

  function buildClip() {
    const pos = [[FRONT - S.ce, SOUTH], [FRONT - S.ce, NORTH], [FRONT - S.cw, NORTH], [FRONT - S.cw, SOUTH]]
      .map(([e, n]) => siteToWorld(e, n, terrain(e, n)));
    tileset.clippingPolygons = new Cesium.ClippingPolygonCollection({
      polygons: [ new Cesium.ClippingPolygon({ positions: pos }) ], enabled: $('clip').checked });
  }

  function setTime() {
    const hr = +$('time').value, d = new Date();
    const m = d.getUTCMonth(), tz = (m >= 9 || m <= 2) ? 13 : 12;      // NZDT Oct–Mar, NZST otherwise
    const t = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) + (hr - tz) * 3600e3);
    viewer.clock.currentTime = Cesium.JulianDate.fromDate(t);
    viewer.clock.shouldAnimate = false;
    const hh = Math.floor(hr), mm = Math.round((hr - hh) * 60);
    $('tv').textContent = ((hh + 11) % 12 + 1) + ':' + String(mm).padStart(2, '0') + (hh < 12 ? ' am' : ' pm');
  }

  const sgn = (v, dp) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp);
  function labels() {
    $('v_sh').textContent = sgn(S.sh, 1) + ' m';
    $('v_sr').textContent = S.sr.toFixed(1) + '°';
    $('v_se').textContent = S.se === 0 ? '0' : Math.abs(S.se).toFixed(1) + ' m ' + (S.se > 0 ? 'east' : 'west');
    $('v_sn').textContent = S.sn === 0 ? '0' : Math.abs(S.sn).toFixed(1) + ' m ' + (S.sn > 0 ? 'north' : 'south');
    $('v_ce').textContent = S.ce < 0 ? (-S.ce).toFixed(1) + ' m into berm' : S.ce.toFixed(1) + ' m in';
    $('v_gx').textContent = S.gx.toFixed(1) + ' m each end';
    $('v_cw').textContent = S.cw.toFixed(1) + ' m in';
    $('v_hh').textContent = 'RL ' + S.hh.toFixed(2);
    $('v_hf').textContent = S.hf.toFixed(2) + ' m';
    $('v_hs').textContent = S.hs.toFixed(2) + ' m';
    $('v_hr').textContent = S.hr.toFixed(1) + '°';
  }

  // ---------- first-person view from the upstairs north windows ----------
  let viewMode = false;
  const V = { vp: 6, vd: 0, vt: -2, ve: 1.6 };
  function updateView() {
    $('v_vp').textContent = V.vp.toFixed(2) + ' m from front';
    $('v_vd').textContent = (V.vd === 0 ? 'straight across No. 3' : Math.abs(V.vd) + '° ' + (V.vd > 0 ? 'right (NE)' : 'left (NW)'));
    $('v_vt').textContent = V.vt.toFixed(1) + '°';
    $('v_ve').textContent = V.ve.toFixed(2) + ' m';
    const upper = 3.0;                                              // upstairs floor is 3.0 m above the ground floor
    const eyeRL = S.hh + upper + V.ve;
    $('vinfo').innerHTML = `Eye level <b>RL ${eyeRL.toFixed(2)}</b> (ground floor RL ${S.hh.toFixed(2)}). ` +
      `No. 3's roof facing you peaks at about <b>RL 16.9</b>: you are <b>${(eyeRL - 16.9 >= 0 ? (eyeRL - 16.9).toFixed(2) + ' m above' : (16.9 - eyeRL).toFixed(2) + ' m below')}</b> it.`;
    if (!viewMode) return;
    housePrims.forEach(p => p.show = false); hirbPrims.forEach(p => p.show = false);
    const nIn = (HOUSE === HOUSES.n30) ? 11.6 : 5.6;              // just inside the north wall of the upstairs
    const [e, n, u] = houseToSite(-V.vp, nIn, upper + V.ve);
    const eye = siteToWorld(e, n, u);
    viewer.camera.frustum.fov = Cesium.Math.toRadians(75);
    viewer.camera.setView({ destination: eye, orientation: {
      heading: Cesium.Math.toRadians(S.sr + S.hr + V.vd), pitch: Cesium.Math.toRadians(V.vt), roll: 0 } });
  }
  function setViewMode(on) {
    viewMode = on;
    const c = scene.screenSpaceCameraController;
    c.enableRotate = c.enableTranslate = c.enableZoom = c.enableTilt = !on;
    housePrims.forEach(p => p.show = on ? false : $('house').checked);    // hide our own walls so you can see out
    hirbPrims.forEach(p => p.show = on ? false : $('hirb').checked);
    if (!on) viewer.camera.frustum.fov = Cesium.Math.toRadians(60);
    updateView();
  }

  function view(e, n, u) {
    if (viewMode) setViewMode(false);
    const target = siteToWorld(FRONT - S.hf - 5, SOUTH + S.hs + 6, S.hh - RL0 + 3), eye = siteToWorld(e, n, u);
    const dir = Cesium.Cartesian3.normalize(Cesium.Cartesian3.subtract(target, eye, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const upv = Cesium.Ellipsoid.WGS84.geodeticSurfaceNormal(eye, new Cesium.Cartesian3());
    const right = Cesium.Cartesian3.normalize(Cesium.Cartesian3.cross(dir, upv, new Cesium.Cartesian3()), new Cesium.Cartesian3());
    const up = Cesium.Cartesian3.cross(right, dir, new Cesium.Cartesian3());
    viewer.camera.flyTo({ destination: eye, orientation: { direction: dir, up }, duration: 1.2 });
  }

  // controls
  const rebuildAll = () => { labels(); buildSite(); buildClip(); buildHouse(); buildHirb(); buildNeigh(); };
  $('neigh').onchange = () => neighPrims.forEach(p => p.show = $('neigh').checked);
  $('g3d').onchange = () => { tileset.show = $('g3d').checked; };
  $('gGrass').onchange = $('gAerial').onchange = () => buildSite();
  $('hirb').onchange = () => hirbPrims.forEach(p => p.show = $('hirb').checked);
  for (const k of ['sh', 'sr', 'se', 'sn']) $(k).oninput = () => { S[k] = +$(k).value; rebuildAll(); };
  $('gx').oninput = () => { S.gx = +$('gx').value; labels(); buildSite(); };
  $('ce').oninput = () => { S.ce = Math.min(+$('ce').value, S.cw - 1); labels(); buildSite(); buildClip(); };
  $('cw').oninput = () => { S.cw = Math.max(+$('cw').value, S.ce + 1); labels(); buildSite(); buildClip(); };
  for (const k of ['hh', 'hf', 'hs', 'hr']) $(k).oninput = () => { S[k] = +$(k).value; labels(); buildHouse(); if (viewMode) housePrims.forEach(p => p.show = false); updateView(); };
  for (const k of ['vp', 'vd', 'vt', 've']) $(k).oninput = () => { V[k] = +$(k).value; updateView(); };
  $('vwGo').onclick = () => setViewMode(true);
  $('vwExit').onclick = () => view(24, 4, 2);
  $('clip').onchange = () => { tileset.clippingPolygons.enabled = $('clip').checked; };
  $('site').onchange = () => sitePrims.forEach(p => p.show = $('site').checked);
  const setGap = v => { S.hs = v; $('hs').value = v; labels(); };
  $('ph1').onchange = () => { HOUSE = HOUSES.p1; setGap(1); buildHouse(); updateView(); };
  $('ph2').onchange = () => { HOUSE = HOUSES.full; setGap(1); buildHouse(); updateView(); };
  $('ph3').onchange = () => { HOUSE = HOUSES.n30; setGap(1.24); buildHouse(); updateView(); };
  $('house').onchange = () => housePrims.forEach(p => p.show = $('house').checked);
  $('shadows').onchange = () => { viewer.shadows = $('shadows').checked; };
  $('time').oninput = setTime;
  $('vStreet').onclick = () => view(24, 4, 2);
  $('vAerial').onclick = () => view(30, -30, 35);
  $('vNorth').onclick  = () => view(-4, 32, 4);
  $('vBack').onclick   = () => view(-45, 2, -2);

  setTime(); rebuildAll(); updateView();
  view(24, 4, 2);
  status('Drag to orbit · scroll to zoom · Ctrl-drag to tilt');
 } catch (err) {
  console.error(err);
  status('Could not load: ' + (err && err.message ? err.message : err));
 }
})();
</script>
</body>
</html>
